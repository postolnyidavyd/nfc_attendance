services:
  db:
    image: postgres:17-alpine
    container_name: nfc_attendance_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: nfc_attendance
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nfc_attendance"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
